name: Test WorkflowHub integration

on:
  push:
    paths:
      - scripts/workflowhub_finder.py
      - tests/test_workflowhub_finder.py
      - requirements.txt
      - .github/workflows/test_workflowhub_integration.yml
  pull_request:
    paths:
      - scripts/workflowhub_finder.py
      - tests/test_workflowhub_finder.py
      - requirements.txt
      - .github/workflows/test_workflowhub_integration.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: python -m pip install -r requirements.txt

      - run: python -m unittest tests/test_workflowhub_finder.py -v
