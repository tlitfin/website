name: Update WorkflowHub data

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-workflowhub-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    env:
      UPDATE_BRANCH: automation/update-workflowhub-data
    steps:
      - name: Check out website
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Update WorkflowHub data
        run: python scripts/workflowhub_finder.py --config _config.yml

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build website
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JEKYLL_BUILD_BRANCH: ${{ github.ref_name }}
          PAGES_REPO_NWO: ${{ github.repository }}

      - name: Check for changes
        id: changes
        run: |
          if [ -z "$(git status --porcelain --untracked-files=all)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          base_sha="$(git rev-parse HEAD)"
          git fetch origin "$UPDATE_BRANCH:refs/remotes/origin/$UPDATE_BRANCH" || true
          git switch -C "$UPDATE_BRANCH" "$base_sha"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update WorkflowHub workflow data"
          git push --force-with-lease origin "$UPDATE_BRANCH"

          if pr_url="$(gh pr view "$UPDATE_BRANCH" --repo "$GITHUB_REPOSITORY" --json url --jq .url 2>/dev/null)"; then
            echo "Updated existing pull request: $pr_url"
          else
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base "$GITHUB_REF_NAME" \
              --head "$UPDATE_BRANCH" \
              --title "Update WorkflowHub workflow data" \
              --body "Automated refresh of WorkflowHub data. The generated YAML and Jekyll build were validated before this pull request was opened."
          fi
