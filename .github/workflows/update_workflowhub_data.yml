name: Update WorkflowHub data

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-workflowhub-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    env:
      UPDATE_BRANCH: automation/update-workflowhub-data
    steps:
      - name: Check out website
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Read configured output path
        id: integration
        run: |
          target="$(python scripts/workflowhub_finder.py --config _config.yml --print-output)"
          echo "target=$target" >> "$GITHUB_OUTPUT"

      - name: Update WorkflowHub data
        if: steps.integration.outputs.target != ''
        run: python scripts/workflowhub_finder.py --config _config.yml

      - name: Set up Ruby
        if: steps.integration.outputs.target != ''
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build website
        if: steps.integration.outputs.target != ''
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JEKYLL_BUILD_BRANCH: ${{ github.ref_name }}
          PAGES_REPO_NWO: ${{ github.repository }}

      - name: Check for changes
        if: steps.integration.outputs.target != ''
        id: changes
        env:
          TARGET: ${{ steps.integration.outputs.target }}
        run: |
          if [ -z "$(git status --porcelain -- "$TARGET")" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update pull request
        if: steps.integration.outputs.target != '' && steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ steps.integration.outputs.target }}
        run: |
          base_sha="$(git rev-parse HEAD)"
          git fetch origin "$UPDATE_BRANCH:refs/remotes/origin/$UPDATE_BRANCH" || true
          git switch -C "$UPDATE_BRANCH" "$base_sha"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$TARGET"
          git commit -m "Update WorkflowHub workflow data"
          git push --force-with-lease origin "$UPDATE_BRANCH"

          pr_url="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "$UPDATE_BRANCH" \
            --base "$GITHUB_REF_NAME" \
            --state open \
            --json url \
            --jq '.[0].url // empty')"

          if [ -n "$pr_url" ]; then
            echo "Updated existing pull request: $pr_url"
          else
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base "$GITHUB_REF_NAME" \
              --head "$UPDATE_BRANCH" \
              --title "Update WorkflowHub workflow data" \
              --body "Automated refresh of WorkflowHub data. The generated YAML and Jekyll build were validated before this pull request was opened."
          fi
