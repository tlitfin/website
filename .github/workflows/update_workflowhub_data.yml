name: Update WorkflowHub data

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-workflowhub-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    env:
      UPDATE_BRANCH: automation/update-workflowhub-data
    steps:
      - name: Check out website
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Test workflow data tools
        run: python -m unittest discover -s tests -v

      - name: Read WorkflowHub integration configuration
        id: integration
        run: |
          readarray -t settings < <(python -c 'import yaml; config=yaml.safe_load(open("_config.yml")) or {}; integration=config.get("workflowhub") or {}; print(str(bool(integration.get("enabled", False))).lower()); print(integration.get("output", ""))')
          enabled="${settings[0]}"
          target="${settings[1]}"
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"

          if [ "$enabled" = "true" ]; then
            if [ -z "$target" ]; then
              echo "workflowhub.output must be configured when the integration is enabled"
              exit 1
            fi
            if [ -f "$target" ]; then
              cp "$target" "$RUNNER_TEMP/data_workflows_baseline.yaml"
              echo "has_baseline=true" >> "$GITHUB_OUTPUT"
            else
              echo "has_baseline=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Generate workflow data
        if: steps.integration.outputs.enabled == 'true'
        run: python scripts/workflowhub_finder.py --config _config.yml

      - name: Validate workflow data
        if: steps.integration.outputs.enabled == 'true'
        env:
          TARGET: ${{ steps.integration.outputs.target }}
          HAS_BASELINE: ${{ steps.integration.outputs.has_baseline }}
        run: |
          baseline_args=()
          if [ "$HAS_BASELINE" = "true" ]; then
            baseline_args=(--baseline "$RUNNER_TEMP/data_workflows_baseline.yaml")
          fi
          python scripts/validate_workflow_data.py \
            "$TARGET" \
            --config _config.yml \
            "${baseline_args[@]}"

      - name: Set up Ruby
        if: steps.integration.outputs.enabled == 'true'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build website
        if: steps.integration.outputs.enabled == 'true'
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JEKYLL_BUILD_BRANCH: ${{ github.ref_name }}
          PAGES_REPO_NWO: ${{ github.repository }}

      - name: Check for changes
        if: steps.integration.outputs.enabled == 'true'
        id: changes
        env:
          TARGET: ${{ steps.integration.outputs.target }}
        run: |
          if [ -z "$(git status --porcelain -- "$TARGET")" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update pull request
        if: steps.integration.outputs.enabled == 'true' && steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ steps.integration.outputs.target }}
        run: |
          base_sha="$(git rev-parse HEAD)"
          git fetch origin "$UPDATE_BRANCH:refs/remotes/origin/$UPDATE_BRANCH" || true
          git switch -C "$UPDATE_BRANCH" "$base_sha"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$TARGET"
          git commit -m "Update WorkflowHub workflow data"
          git push --force-with-lease origin "$UPDATE_BRANCH"

          if pr_url="$(gh pr view "$UPDATE_BRANCH" --repo "$GITHUB_REPOSITORY" --json url --jq .url 2>/dev/null)"; then
            echo "Updated existing pull request: $pr_url"
          else
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base "$GITHUB_REF_NAME" \
              --head "$UPDATE_BRANCH" \
              --title "Update WorkflowHub workflow data" \
              --body "Automated refresh of WorkflowHub data. The generated YAML and Jekyll build were validated before this pull request was opened."
          fi
